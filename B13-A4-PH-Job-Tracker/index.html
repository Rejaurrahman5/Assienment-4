 <link rel="preconnect" href="https://fonts.googleapis.com">

<body>
    <section class="bg-base-200 pt-5 ">
        <div class="container mx-auto">
          <h1 class="text-2xl font-bold">Job Application Tracker</h1>
        <br>
        <div class="flex gap-12 items-center  ">
            <div class="bg-base-100 p-4 w-1/5 rounded ">
                <h2 class="font-semibold">Total</h2>
                <h5 class="text-info-content">8</h5>
            </div>
            <div class="bg-base-100 p-4 w-1/5 rounded ">
                <h2 class="font-semibold">Interview</h2>
                <h5 class="text-success">0</h5>
            </div>
            <div class="bg-base-100 p-4 w-1/5 rounded ">
                <h2 class="font-semibold">Rejected</h2>
                <h5 class="text-warning ">0</h5>
            </div>
        </div>
        </div>
        <br>
        <br>
        <div class="container mx-auto flex col">
            <h2 class="w-10/12 text-xl font-bold">Available Jobs</h2>
            <p>8 jobs</p>
            
        </div>
        <br>
        <div>
            <div class="container mx-auto flex gap-8 items-center">
                <h4 class=" bg-primary text-white px-12 py-3 rounded-xl">All</h4>
                <h4 class=" bg-base-100 px-12 py-3 rounded-xl ">Interview</h4>
                <h4 class=" bg-base-100 px-12 py-3 rounded-xl">Rejected</h4>
                
            </div>
        </div>
        <br>

    </section>
